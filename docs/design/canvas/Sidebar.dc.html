<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Navigation praticien</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E14}
a{color:#6DD4B8}a:hover{color:#A8E6CF}
</style>
</helmet>
<nav aria-label="Navigation principale" style="width: 100%; min-height: 1120px; box-sizing: border-box; background: #151A23; border-right: 1px solid #2A3140; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #E8EDF4">
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 18px; border-bottom: 1px solid #2A3140">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #23383B; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6DD4B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 600; letter-spacing: 0.01em">Afeia</span>
      <span style="font-size: 12px; color: #8B95A5">Espace praticien</span>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 18px 12px">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8B95A5; padding: 0 12px 6px">{{sec.label}}</span>
        <sc-for list="{{sec.items}}" as="item" hint-placeholder-count="3">
          <a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{item.bg}}; color: {{item.fg}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
            <span style="flex: 1">{{item.label}}</span>
            <sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}">
              <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #E8A87C; color: #0A0E14; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{item.badge}}</span>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-top: 1px solid #2A3140">
    <div style="width: 36px; height: 36px; border-radius: 18px; background: #E8A87C; color: #0A0E14; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center">CM</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 14px; font-weight: 500">Claire Martin</span>
      <span style="font-size: 12px; color: #8B95A5">Praticienne</span>
    </div>
    <a href="#" aria-label="Paramètres" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8B95A5; border-radius: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","revue","consultants","agenda","messages","questionnaires","bibliotheque","facturation","stats"],"default":"dashboard"},"$preview":{"width":248,"height":1120}}'>
class Component extends DCLogic {

    const mk = (key, label, href, badge) => ({

    return {

}
</script>
</body>
</html>
